name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python deps
        run: pip install pillow numpy
      - name: Run tests
        run: |
          bash scripts/check_gh_pages_root_redirects.sh
          node scripts/test_midnight_hours.mjs
          node scripts/test_ruleta_spin.mjs
          node scripts/test_category_filters.mjs
          python3 scripts/test_logo_utils_auth.py
          python3 scripts/test_logo_standardize.py
          python3 scripts/test_logo_standardize_v2.py
          python3 scripts/test_logo_version.py