name: Portal

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/portal-tools" playwright@1.65.1
          npx --prefix "$RUNNER_TEMP/portal-tools" playwright install --with-deps chromium
      - name: Portal smoke
        env:
          PLAYWRIGHT_ENTRY: ${{ runner.temp }}/portal-tools/node_modules/playwright/index.mjs
        run: node --test scripts/test_portal_smoke.mjs
